name: ridecompare
description: "Compare Uber, Ola and Rapido ride estimates"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

# Versions are pinned to releases at least two weeks old (supply-chain hygiene).
dependencies:
  flutter:
    sdk: flutter
  material_ui: 1.9.0
  cupertino_icons: 2.0.0
  flutter_riverpod: 3.4.3
  go_router: 18.1.2
  dio: 5.11.1
  google_maps_flutter: 2.19.0
  flutter_map: 8.3.2
  latlong2: 0.10.1
  geolocator: 14.1.2
  intl: 0.20.3
  uuid: 4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
